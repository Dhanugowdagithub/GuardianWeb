<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
body { background:#f5f3ff; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.container { max-width:400px; width:100%; padding:24px 16px; }
.card {
  background:white; border-radius:14px; padding:28px;
  box-shadow:0 2px 6px rgba(0,0,0,0.06); border:1px solid #e5e0f7;
}
.title { font-size:19px; font-weight:600; color:#333; margin-bottom:6px; }
.subtitle { font-size:13px; color:#777; margin-bottom:22px; }
label { font-size:13px; color:#555; font-weight:500; display:block; margin-bottom:6px; }
input {
  width:100%; padding:11px 14px; border:1px solid #ddd; border-radius:8px;
  font-size:14px; outline:none; margin-bottom:6px;
}
input:focus { border-color:#6c4bc9; }
.hint { font-size:11px; color:#999; margin-bottom:16px; }
.btn {
  width:100%; padding:13px; background:#6c4bc9; color:white;
  border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px;
}
.btn:hover { background:#533a9e; }
.msg { padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px; }
.msg-success { background:#e6f7ea; color:#2f9e44; }
.msg-error { background:#fdeaea; color:#e03131; }
.back-link { display:block; text-align:center; margin-top:18px; font-size:13px; color:#6c4bc9; text-decoration:none; }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">Forgot Password</div>
    <div class="subtitle">Enter your registered mobile number to receive an OTP.</div>

    {% if messages %}
      {% for message in messages %}
        <div class="msg {% if message.tags == 'success' %}msg-success{% else %}msg-error{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <label>Registered Mobile Number</label>
      <input type="text" name="phone" id="phoneInput" maxlength="10" placeholder="10-digit number" required>
      <div class="hint">Digits only, 10 numbers.</div>
      <button type="submit" class="btn">Send OTP</button>
    </form>

    <a href="{% url 'login_page' %}" class="back-link">← Back to Login</a>
  </div>
</div>

<script>
document.getElementById("phoneInput").addEventListener("input", function(e) {
    this.value = this.value.replace(/[^0-9]/g, "");
});
</script>

</body>
</html>
