<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reset Password</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
body { background:#f5f3ff; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.container { max-width:400px; width:100%; padding:24px 16px; }
.card {
  background:white; border-radius:14px; padding:28px;
  box-shadow:0 2px 6px rgba(0,0,0,0.06); border:1px solid #e5e0f7;
}
.title { font-size:19px; font-weight:600; color:#333; margin-bottom:6px; }
.subtitle { font-size:13px; color:#777; margin-bottom:22px; }
label { font-size:13px; color:#555; font-weight:500; display:block; margin-bottom:6px; margin-top:14px; }
input {
  width:100%; padding:11px 14px; border:1px solid #ddd; border-radius:8px;
  font-size:14px; outline:none;
}
input:focus { border-color:#6c4bc9; }
.hint { font-size:11px; color:#999; margin-top:4px; }
.btn {
  width:100%; padding:13px; background:#6c4bc9; color:white;
  border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-top:22px;
}
.btn:hover { background:#533a9e; }
.msg { padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px; }
.msg-success { background:#e6f7ea; color:#2f9e44; }
.msg-error { background:#fdeaea; color:#e03131; }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">Reset Password</div>
    <div class="subtitle">Set a new password for your account.</div>

    {% if messages %}
      {% for message in messages %}
        <div class="msg {% if message.tags == 'success' %}msg-success{% else %}msg-error{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <label>New Password</label>
      <input type="password" name="password" placeholder="Enter new password" required>
      <div class="hint">8–12 characters, 1 uppercase letter, 1 special character.</div>

      <label>Confirm Password</label>
      <input type="password" name="confirm_password" placeholder="Re-enter new password" required>

      <button type="submit" class="btn">Reset Password</button>
    </form>
  </div>
</div>

</body>
</html>
