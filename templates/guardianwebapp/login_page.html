<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guardian — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #0D1B2A;
      --navy2:   #162032;
      --purple:  #7B2FBE;
      --purple-light: #9B59D0;
      --rose:    #E8365D;
      --sage:    #4CAF8A;
      --white:   #F8F9FA;
      --muted:   #8A97A8;
      --border:  #1E2F42;
      --error:   #E8365D;
      --success: #4CAF8A;
    }

    @keyframes shieldPulse {
      0%, 100% { filter: drop-shadow(0 0 6px #7B2FBE88); }
      50%       { filter: drop-shadow(0 0 18px #7B2FBEcc); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 60% 0%, #1a1050 0%, var(--navy) 60%);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      padding: 24px 16px;
    }

    .card {
      background: var(--navy2);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 40px 36px 36px;
      animation: fadeUp 0.5s ease both;
      box-shadow: 0 24px 64px #00000066, 0 0 0 1px #ffffff08 inset;
    }

    /* ── Logo ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo svg {
      animation: shieldPulse 3s ease-in-out infinite;
      flex-shrink: 0;
    }
    .logo-text {
      line-height: 1;
    }
    .logo-text .brand {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--white);
    }
    .logo-text .tagline {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* ── Headings ── */
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Field ── */
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 7px;
      letter-spacing: 0.2px;
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      pointer-events: none;
      line-height: 0;
    }
    .input-wrap input {
      width: 100%;
      background: var(--navy);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 44px 12px 42px;
      font-size: 15px;
      color: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrap input::placeholder { color: var(--muted); }
    .input-wrap input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px #7B2FBE22;
    }
    .input-wrap input.valid   { border-color: var(--sage); }
    .input-wrap input.invalid { border-color: var(--rose); }

    /* phone prefix */
 .phone-prefix {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      pointer-events: none;
      letter-spacing: 0.5px;
      padding-right: 12px;
      border-right: 1px solid #1E2F42;
      width: 30px;
      display: inline-block;
    }
    .input-wrap input.has-prefix { padding-left: 74px !important; }
    /* toggle password */
    .toggle-pw {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      line-height: 0;
      transition: color 0.15s;
    }
    .toggle-pw:hover { color: var(--white); }

    /* field hint / error */
    .field-msg {
      font-size: 12px;
      margin-top: 5px;
      min-height: 16px;
      padding-left: 2px;
    }
    .field-msg.err     { color: var(--rose); }
    .field-msg.ok      { color: var(--sage); }
    .field-msg.neutral { color: var(--muted); }

    /* strength bar */
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 7px;
    }
    .strength-bar span {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      background: var(--border);
      transition: background 0.3s;
    }

    /* ── Submit ── */
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--purple), #5c20a0);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      letter-spacing: 0.3px;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid #ffffff44;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn-primary.loading .btn-label { display: none; }
    .btn-primary.loading .spinner    { display: block; }

    /* ── Footer links ── */
    .forgot {
      display: block;
      text-align: right;
      font-size: 13px;
      color: var(--purple-light);
      text-decoration: none;
      margin-top: -10px;
      margin-bottom: 18px;
    }
    .forgot:hover { text-decoration: underline; }

    .register-row {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      margin-top: 22px;
    }
    .register-row a {
      color: var(--purple-light);
      text-decoration: none;
      font-weight: 600;
    }
    .register-row a:hover { text-decoration: underline; }

    /* ── SOS strip ── */
    .sos-strip {
      margin-top: 28px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sos-strip svg { flex-shrink: 0; }
    .sos-strip p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .sos-strip p strong { color: var(--rose); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1e2d40;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      color: var(--white);
      white-space: nowrap;
      transition: transform 0.35s ease, opacity 0.35s;
      opacity: 0;
      z-index: 999;
      box-shadow: 0 8px 24px #00000055;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.toast-err  { border-color: var(--rose);    }
    #toast.toast-ok   { border-color: var(--sage);    }

    @media (max-width: 480px) {
      .card { padding: 32px 22px 28px; }
    }
  </style>
</head>
<body>

<div class="card" role="main">

  <!-- Logo -->
  <div class="logo">
    <svg width="38" height="42" viewBox="0 0 38 42" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 2L4 8.5V20C4 29.5 10.5 38.1 19 40C27.5 38.1 34 29.5 34 20V8.5L19 2Z"
            fill="url(#sg)" stroke="#7B2FBE" stroke-width="1.5"/>
      <path d="M13 21l4 4 8-8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="sg" x1="4" y1="2" x2="34" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="#7B2FBE"/>
          <stop offset="1" stop-color="#3d1070"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="logo-text">
      <div class="brand">GuardianWeb</div>
      <div class="tagline">Women Safety Platform</div>
    </div>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in with your registered mobile number and password.</p>

  <form method="POST" action="{% url 'login_page' %}">
    {% csrf_token %}

    <!-- Phone -->
    <div class="field">
      <label for="phone">Mobile number</label>
   <div class="input-wrap">
  <span class="phone-prefix">+91</span>
  <input type="tel" id="phone" name="phone" class="has-prefix"
         maxlength="10"
         inputmode="numeric" autocomplete="off" required />
</div>
      <div class="field-msg neutral" id="phone-msg"></div>
    </div>

    <!-- Password -->
    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <span class="input-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </span>
        <input type="password" id="password" name="password"
               placeholder="Enter password" autocomplete="current-password" required />
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
          <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="strength-bar" id="strengthBar">
        <span id="s1"></span><span id="s2"></span><span id="s3"></span><span id="s4"></span>
      </div>
      <div class="field-msg neutral" id="pw-msg"></div>
    </div>

    <a href="{% url 'forgot_password' %}" style="color: white; text-decoration: none;">Forgot Password?</a>

    <button type="submit" class="btn-primary" id="submitBtn">
      <span class="btn-label">Sign in</span>
      <span class="spinner"></span>
    </button>

  </form>

  <div class="register-row">
    New to GuardianWeb? <a href="{% url 'registration_view' %}" >Create an account</a>
  </div>

  <!-- SOS reminder -->
  <div class="sos-strip">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8365D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p>In an emergency, call <strong>112</strong> or use the in-app <strong>SOS button</strong> — no login required.</p>
  </div>

</div>

<div id="toast"></div>

<script>
  /* ─── Helpers ─── */
  const $ = id => document.getElementById(id);
  const phoneInput  = $('phone');
  const pwInput     = $('password');
  const phoneMsg    = $('phone-msg');
  const pwMsg       = $('pw-msg');
  const submitBtn   = $('submitBtn');
  const form        = $('loginForm');

  function showToast(msg, type = 'ok') {
    const t = $('toast');
    t.textContent = msg;
    t.className = `show toast-${type}`;
    clearTimeout(t._tid);
    t._tid = setTimeout(() => t.className = '', 3200);
  }

  function setField(input, msgEl, state, msg) {
    input.className = state;       // 'valid' | 'invalid' | ''
    msgEl.className = `field-msg ${state === 'valid' ? 'ok' : state === 'invalid' ? 'err' : 'neutral'}`;
    msgEl.textContent = msg;
  }

  /* ─── Phone validation ─── */
  phoneInput.addEventListener('input', () => {
    phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, 10);
    const v = phoneInput.value;
    if (!v)            setField(phoneInput, phoneMsg, '', '');
    else if (v.length < 10) setField(phoneInput, phoneMsg, 'invalid', 'Enter a 10-digit mobile number');
    else if (!/^[6-9]/.test(v)) setField(phoneInput, phoneMsg, 'invalid', 'Must start with 6, 7, 8, or 9');
    else               setField(phoneInput, phoneMsg, 'valid', 'Looks good');
  });

  /* ─── Password strength ─── */
  const bars   = [$('s1'), $('s2'), $('s3'), $('s4')];
  const colors = ['#E8365D', '#e87d36', '#e8c836', '#4CAF8A'];

  function getStrength(pw) {
    let score = 0;
    if (pw.length >= 8)  score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    return score;
  }

  const strengthLabels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

  pwInput.addEventListener('input', () => {
    const pw = pwInput.value;
    const s  = pw ? getStrength(pw) : 0;
    bars.forEach((b, i) => b.style.background = i < s ? colors[s - 1] : 'var(--border)');
    if (!pw)        setField(pwInput, pwMsg, '', '');
    else if (s < 2) setField(pwInput, pwMsg, 'invalid', `${strengthLabels[s]} — add uppercase letters, numbers, or symbols`);
    else            setField(pwInput, pwMsg, 'valid', `${strengthLabels[s]} password`);
  });

  /* ─── Toggle password visibility ─── */
  $('togglePw').addEventListener('click', () => {
    const visible = pwInput.type === 'text';
    pwInput.type = visible ? 'password' : 'text';
    $('eyeIcon').innerHTML = visible
      ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`
      : `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
         <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
         <line x1="1" y1="1" x2="23" y2="23"/>`;
  });

  /* ─── Forgot password ─── */
  $('forgotLink').addEventListener('click', e => {
    e.preventDefault();
    showToast('📲 OTP reset link will be sent to your registered number.', 'ok');
  });

  /* ─── Form submit ─── */
  // Retained original broken submit handler (commented out):
  /*
  let valid = true;

  const phone = phoneInput.value.trim();
  const pw    = pwInput.value;

  if (!phone || phone.length !== 10 || !/^[6-9]/.test(phone)) {
    setField(phoneInput, phoneMsg, 'invalid', 'Enter a valid 10-digit mobile number');
    valid = false;
  }
  if (!pw) {
    setField(pwInput, pwMsg, 'invalid', 'Password is required');
    valid = false;
  } else if (getStrength(pw) < 2) {
    setField(pwInput, pwMsg, 'invalid', 'Password is too weak');
    valid = false;
  }
  if (!valid) return;

  submitBtn.classList.add('loading');
  submitBtn.disabled = true;

  await new Promise(r => setTimeout(r, 1800));   // ← swap for real API call

  submitBtn.classList.remove('loading');
  submitBtn.disabled = false;

  showToast('✅ Signed in successfully! Redirecting…',);
  setTimeout(() => { }, 2000);
  */

  // Correct working submit handler:
  const loginForm = document.querySelector('form');
  if (loginForm) {
    loginForm.addEventListener('submit', (e) => {
      let isValid = true;
      const phone = phoneInput.value.trim();
      const pw    = pwInput.value;

      if (!phone || phone.length !== 10 || !/^[6-9]/.test(phone)) {
        setField(phoneInput, phoneMsg, 'invalid', 'Enter a valid 10-digit mobile number');
        isValid = false;
      }
      if (!pw) {
        setField(pwInput, pwMsg, 'invalid', 'Password is required');
        isValid = false;
      }
      
      if (!isValid) {
        e.preventDefault();
        return;
      }

      // Add loading spinner on successful submission
      submitBtn.classList.add('loading');
    });
  }
</script>
</body>
</html>
