{% extends "guardianwebapp/base.html" %}
{% block content %}
<div class="container" style="max-width:500px; margin:30px auto;">
    <h2>Notifications</h2>

    <div class="alert-list" style="margin-top:16px;">
        {% if notifications %}
            {% for n in notifications %}
                <div class="alert-item" style="display:flex; gap:10px; padding:12px; background:var(--color-background-secondary); border-radius:8px; margin-bottom:10px;">
                    <div class="alert-icon" style="background:{{ n.color }}; color:{{ n.text_color }}; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                        <i class="ti {{ n.icon }}" aria-hidden="true"></i>
                    </div>
                    <div>
                        <div style="font-weight:500;">{{ n.title }}</div>
                        <div style="font-size:12px; color:gray;">{{ n.time|date:"D, d M Y, h:i A" }}</div>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <p style="text-align:center; color:gray; padding:30px 0;">No notifications yet.</p>
        {% endif %}
    </div>

    <a href="{% url 'user_dashboard' %}" style="display:block; text-align:center; margin-top:16px;">← Back to Dashboard</a>
</div>
{% endblock %}
