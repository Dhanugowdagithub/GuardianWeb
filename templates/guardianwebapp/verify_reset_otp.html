<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verify OTP</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
body { background:#f5f3ff; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.container { max-width:400px; width:100%; padding:24px 16px; }
.card {
  background:white; border-radius:14px; padding:28px;
  box-shadow:0 2px 6px rgba(0,0,0,0.06); border:1px solid #e5e0f7;
}
.title { font-size:19px; font-weight:600; color:#333; margin-bottom:6px; }
.subtitle { font-size:13px; color:#777; margin-bottom:22px; }
label { font-size:13px; color:#555; font-weight:500; display:block; margin-bottom:6px; }
input {
  width:100%; padding:11px 14px; border:1px solid #ddd; border-radius:8px;
  font-size:16px; outline:none; margin-bottom:16px; letter-spacing:4px; text-align:center;
}
input:focus { border-color:#6c4bc9; }
.btn {
  width:100%; padding:13px; background:#6c4bc9; color:white;
  border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;
}
.btn:hover { background:#533a9e; }
.btn-resend {
  width:100%; padding:11px; background:transparent; color:#6c4bc9;
  border:1px solid #6c4bc9; border-radius:8px; font-size:14px; font-weight:600;
  cursor:pointer; margin-top:10px;
}
.btn-resend:hover { background:#f5f3ff; }
.msg { padding:10px 14px; border-radius:8px; margin-bottom:16px; font-size:13px; }
.msg-success { background:#e6f7ea; color:#2f9e44; }
.msg-error { background:#fdeaea; color:#e03131; }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">Verify OTP</div>
    <div class="subtitle">Enter the 6-digit code sent to your registered mobile number.</div>

    {% if messages %}
      {% for message in messages %}
        <div class="msg {% if message.tags == 'success' %}msg-success{% else %}msg-error{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <label>Enter OTP</label>
      <input type="text" name="otp" maxlength="6" placeholder="------" required>
      <button type="submit" class="btn">Verify OTP</button>
    </form>

    <form method="POST">
      {% csrf_token %}
      <button type="submit" name="resend" value="1" class="btn-resend">Resend OTP</button>
    </form>
  </div>
</div>

</body>
</html>
