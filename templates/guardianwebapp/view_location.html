<!DOCTYPE html>
<html>
<head>
    <title>Live Location</title>

    <style>
        #map{
            width:100%;
            height:600px;
        }
    </style>
</head>

<body>

<h2>Live Location</h2>

<div id="map"></div>

<script>

let map;
let marker;

function initMap(){

    const pos={
        lat:{{ location.latitude|default:0 }},
        lng:{{ location.longitude|default:0 }}
    };

    map=new google.maps.Map(document.getElementById("map"),{
        zoom:16,
        center:pos
    });

    marker=new google.maps.Marker({
        position:pos,
        map:map
    });

    setInterval(updateLocation,5000);
}

function updateLocation(){

    fetch("{% url 'get_live_location' %}")

    .then(response=>response.json())

    .then(data=>{

        if(data.success){

            const p={
                lat:data.latitude,
                lng:data.longitude
            };

            marker.setPosition(p);
            map.setCenter(p);
        }

    });

}

</script>

<!-- Retained original script import:
<script async defer
src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
</script>
-->
<script async defer
src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_KEY }}&callback=initMap">
</script>

</body>
</html>
