{% extends "guardianwebapp/base.html" %}
{% block content %}
<div class="card" style="max-width:420px; margin:40px auto; text-align:center; padding:30px;">
    <div style="font-size:48px; margin-bottom:12px;">🧑‍🤝‍🧑</div>
    <h2>Companion Mode</h2>
    <p style="color:gray; margin:12px 0 24px;">Feeling unsafe or just want someone to talk to? Request a companion now.</p>

    <form method="POST" action="{% url 'companion_view' %}">
        {% csrf_token %}
        <input type="hidden" name="action" value="start_request">
        <button type="submit" style="width:100%; padding:14px; background:#4b49ac; color:white; border:none; border-radius:8px; font-size:15px; cursor:pointer;">
            Request a Companion
        </button>
    </form>
</div>
{% endblock %}
